name: focus_desk
description: Focus timer, task queue, streaks and stats for Windows, macOS and Linux, with offline-first sync to the Relay backend.
publish_to: none
version: 2.0.0
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  window_manager: ^0.4.2
  local_notifier: ^0.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
